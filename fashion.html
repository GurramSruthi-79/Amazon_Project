<body>
    <style>
 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial;
    background: #f3f3f3;
}


/* Header */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #131921;
    color: white;
    padding: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.search input {
    padding: 8px;
    width: 300px;
}


/* Navigation */

nav {
    background: lch(47.78% 76.28 350.85);;
    padding: 10px;
}

.menu {
    display: flex;
    gap: 20px;
}

.menu a {
    color: white;
    text-decoration: none;
}


/* Toggle */

.toggle {
    display: none;
    color: white;
    font-size: 30px;
    cursor: pointer;
}


/* Banner */

.banner {
    background: orange;
    text-align: center;
    padding: 40px;
    color: white;
}


/* Products */

.products {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}

.product {
    background: white;
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    width: 200px;
    transition: transform 0.3s;
    box-shadow: 0 8px 10px orangered;
}

.product:hover {
    transform: scale(1.2);
}

.product img {
    width: 150px;
    height: 150px;
}

button {
    background: orange;
    border: none;
    padding: 10px;
    cursor: pointer;
}

button:hover {
    background-color: #fb641b;
}


/* Footer */

footer {
    background: #131921;
    color: white;
    text-align: center;
    padding: 10px;
}


/* =========================
   RESPONSIVE DESIGN
   ========================= */

@media (max-width: 600px) {

    /* Header */

    header {
        flex-wrap: wrap;
        gap: 10px;
    }

    .logo {
        font-size: 20px;
    }

    .search {
        width: 100%;
    }

    .search input {
        width: 100%;
    }


    /* Toggle */

    .toggle {
        display: block;
    }


    /* Navigation */

    nav {
        display: flex;
        flex-wrap: wrap;
    }

    .menu {
        display: none;
        width: 100%;
        flex-direction: column;
        text-align: center;
        gap: 15px;
        padding-top: 15px;
    }

    .menu.active {
        display: flex;
    }


    /* Banner */

    .banner {
        padding: 25px 10px;
    }

    .banner h1 {
        font-size: 25px;
    }

    .banner p {
        font-size: 15px;
    }


    /* Products */

    .products {
        flex-direction: column;
        align-items: center;
    }

    .product {
        width: 90%;
        max-width: 300px;
    }

    .product:hover {
        transform: none;
    }

}


/* Tablet */

@media (min-width: 601px) and (max-width: 900px) {

    .search input {
        width: 200px;
    }

    .products {
        flex-wrap: wrap;
    }

}
</style>
